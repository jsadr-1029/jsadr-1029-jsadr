# =====================================================
# Auto-Deploy a Vercel — Triggered on push to main
# =====================================================
# Este workflow reemplaza la integración nativa Vercel-GitHub App.
# Cada vez que se hace push a `main`, GitHub Actions construye
# el proyecto y lo despliega a producción en Vercel usando el CLI
# y los secrets del repositorio.
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   - VERCEL_TOKEN        → token de Vercel (vcp_...)
#   - VERCEL_ORG_ID       → team id (team_...)
#   - VERCEL_PROJECT_ID   → project id (prj_...)
#
# Si el token deja de funcionar (403 invalidToken):
#   1. Generar uno nuevo en https://vercel.com/account/tokens
#   2. Actualizar el secret VERCEL_TOKEN en
#      https://github.com/jsadr-1029/jsadr-1029-jsadr/settings/secrets/actions
#   3. El próximo push se desplegará automáticamente.
# =====================================================

name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch: # Permite dispararlo manualmente desde la pestaña Actions

# Evita deploys concurrentes: si un nuevo push llega mientras
# otro está construyendo, se cancela el anterior y se inicia el nuevo.
concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Vercel (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Vercel CLI
        run: npm install --no-save vercel@latest

      - name: Verify Vercel CLI is available
        run: |
          echo "PATH=$PATH"
          ls -la node_modules/.bin/vercel || echo "vercel bin not found"
          npx vercel --version
          # Add node_modules/.bin to PATH for subsequent steps
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pull Vercel environment (production)
        run: |
          npx vercel pull --yes --environment=production \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Generate Prisma client
        run: npx prisma generate

      # =====================================================
      # QA REGRESSION GATE — Bloquea el deploy si algún módulo falla
      # =====================================================
      # Ejecuta los 13 scripts qa-m0X-*.ts en paralelo contra:
      #   - Código fuente (src/)
      #   - Schema Prisma (prisma/schema.prisma)
      #   - Base de datos Neon PostgreSQL (vía DATABASE_URL del .vercel/.env.production)
      #   - Configuración (.env.example, vercel.json, package.json, .github/workflows/)
      #
      # Si cualquier sub-test falla, el step falla (exit code 1) y el deploy NO procede.
      # Los resultados se suben como artifact para análisis posterior.
      # Duración esperada: ~30-60s (concurrencia 4 workers, timeout 180s/script).
      - name: QA Regression Gate (13 módulos, 624 sub-tests)
        id: qa-gate
        run: |
          # Cargar variables de entorno de producción descargadas por `vercel pull`
          if [ -f .vercel/.env.production ]; then
            echo "📋 Cargando variables desde .vercel/.env.production..."
            # Exportar solo las variables que los scripts QA necesitan (no filtrar para no perder ninguna)
            set -a
            . .vercel/.env.production
            set +a
            echo "✅ Variables cargadas: $(grep -c '=' .vercel/.env.production || echo 0)"
          else
            echo "⚠️  .vercel/.env.production no encontrado — los tests que requieren BD fallarán."
          fi

          echo ""
          echo "═══════════════════════════════════════════════════════════"
          echo "  Iniciando QA Regression Gate (pre-deploy gate)"
          echo "═══════════════════════════════════════════════════════════"
          echo ""

          # Ejecutar orquestador — exit 0 = todos PASS, exit 1 = algún FAIL
          node scripts/qa-regression-all.cjs

          echo ""
          echo "✅ QA Regression Gate PASS — procediendo con deploy a producción."
        env:
          NODE_ENV: production

      - name: Upload QA Regression results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-results
          path: |
            download/qa-regresion-results.json
            download/reporte-regresion-qa.pdf
          if-no-files-found: warn
          retention-days: 30

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          DEPLOY_URL=$(npx vercel deploy --prod \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --project="$VERCEL_PROJECT_ID" \
            --yes)
          echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployment URL: $DEPLOY_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        if: always()
        run: |
          echo "## Vercel Deploy Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Deployment exitoso**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**URL:** ${{ steps.deploy.outputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Commit:** ${{ github.event.head_commit.message }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Author:** ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**SHA:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Deployment fallido**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Revisa los logs arriba para detalles." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Posibles causas:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **QA Regression Gate falló**: revisa el step 'QA Regression Gate' y el artifact \`qa-regression-results\` con el JSON detallado. El deploy se bloquea hasta que todos los 13 módulos pasen." >> "$GITHUB_STEP_SUMMARY"
            echo "- **HTTP 403 invalidToken**:" >> "$GITHUB_STEP_SUMMARY"
            echo "  1. Genera un nuevo token en https://vercel.com/account/tokens" >> "$GITHUB_STEP_SUMMARY"
            echo "  2. Actualiza el secret \`VERCEL_TOKEN\` en [GitHub settings](https://github.com/jsadr-1029/jsadr-1029-jsadr/settings/secrets/actions)" >> "$GITHUB_STEP_SUMMARY"
            echo "  3. Re-run este workflow desde la pestaña Actions" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### QA Regression Gate status" >> "$GITHUB_STEP_SUMMARY"
            echo "El step 'QA Regression Gate' debe mostrar ✅ PASS antes del deploy. Si falló, descarga el artifact para ver qué módulo rompió." >> "$GITHUB_STEP_SUMMARY"
          fi
