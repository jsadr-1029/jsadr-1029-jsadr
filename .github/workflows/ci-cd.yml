name: CI/CD - JSADR Plataforma

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Evitar ejecuciones concurrentes en la misma rama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================
  # Job 1: Lint + Type-check + Build
  # =====================================================
  build:
    name: Build & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "file:./test.db"
      JWT_SECRET: "ci-test-secret-not-for-prod-00000000000000000000000000000000"
      JWT_REFRESH_SECRET: "ci-test-refresh-secret-not-for-prod-00000000000000000000000000"
      API_ENCRYPTION_KEY: "3f1b9c8d7e60524a8f9b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2"
      OTP_CHAT_SECRET: "ci-otp-secret-not-for-prod-0000000000000000000000000000000000"
      PORTAL_SESSION_SECRET: "ci-portal-secret-not-for-prod-000000000000000000000000000000"
      ADMIN_SESSION_SECRET: "ci-admin-secret-not-for-prod-00000000000000000000000000000000"
      ALLOWED_ORIGINS: "http://localhost:3000"
      NODE_ENV: "test"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Aplicar schema a BD de prueba
        run: npx prisma db push --accept-data-loss

      - name: Type-check (TypeScript)
        run: npx tsc --noEmit
        continue-on-error: true # por ahora, hasta limpiar scripts legacy

      - name: ESLint
        run: npx eslint src/ --max-warnings 0 || true

      - name: Build Next.js
        run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
          retention-days: 7

  # =====================================================
  # Job 2: Test de endpoints críticos (smoke test)
  # =====================================================
  smoke-test:
    name: Smoke Test API
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    env:
      DATABASE_URL: "file:./test.db"
      JWT_SECRET: "ci-test-secret-not-for-prod-00000000000000000000000000000000"
      JWT_REFRESH_SECRET: "ci-test-refresh-secret-not-for-prod-00000000000000000000000000"
      API_ENCRYPTION_KEY: "3f1b9c8d7e60524a8f9b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2"
      OTP_CHAT_SECRET: "ci-otp-secret-not-for-prod-0000000000000000000000000000000000"
      PORTAL_SESSION_SECRET: "ci-portal-secret-not-for-prod-000000000000000000000000000000"
      ADMIN_SESSION_SECRET: "ci-admin-secret-not-for-prod-00000000000000000000000000000000"
      ALLOWED_ORIGINS: "http://localhost:3000"
      NODE_ENV: "test"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Generar Prisma + Push schema
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Iniciar servidor en background
        run: |
          npx next start -p 3100 &
          sleep 5
        env:
          PORT: 3100

      - name: Smoke test endpoints
        run: |
          set -e
          echo "→ Health check"
          curl -s -o /dev/null -w "%{http_code}\n" http://localhost:3100/api/health || true

          echo "→ Seguridad: plataformas-sync"
          curl -s http://localhost:3100/api/seguridad/plataformas-sync | head -c 200
          echo ""

          echo "→ Webhook info (GET)"
          curl -s http://localhost:3100/api/seguridad/plataformas-sync/webhook | head -c 200
          echo ""

  # =====================================================
  # Job 3: Deploy automático a Vercel (solo en main)
  # =====================================================
  deploy-vercel:
    name: Deploy a Vercel (producción)
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull entorno de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build proyecto (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy a Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # =====================================================
  # Job 4: Notificación a Slack/Teams (opcional)
  # =====================================================
  notify:
    name: Notificar despliegue
    runs-on: ubuntu-latest
    needs: [build, smoke-test, deploy-vercel]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Estado final
        run: |
          echo "Build: ${{ needs.build.result }}"
          echo "Smoke: ${{ needs.smoke-test.result }}"
          echo "Deploy: ${{ needs.deploy-vercel.result }}"
          if [[ "${{ needs.deploy-vercel.result }}" == "success" ]]; then
            echo "✅ Despliegue exitoso en producción"
          else
            echo "⚠️ Revisar jobs anteriores"
          fi
