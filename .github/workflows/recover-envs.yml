name: Recover Env Vars (TEMPORAL)
on:
  workflow_dispatch:

jobs:
  pull-envs:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install Vercel CLI
        run: npm install --no-save vercel@latest

      - name: Pull production envs
        run: |
          set +e
          npx vercel link --yes --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN" 2>&1
          echo "--- pull production ---"
          npx vercel env pull --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --project="$VERCEL_PROJECT_ID" --environment=production .env.production 2>&1
          echo "exit=$?"
          ls -la .env.production 2>&1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Upload env artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vercel-envs
          path: .env.production
          retention-days: 1
          if-no-files-found: error
